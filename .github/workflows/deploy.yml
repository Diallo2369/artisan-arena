# Construit et publie le site sur GitHub Pages :
# - à chaque envoi sur la branche main ;
# - à la demande, depuis l'onglet Actions.
# Pas de reconstruction programmée : les données (annuaire, BODACC, INPI, ADEME) sont lues en direct par le navigateur.
name: Construire et publier

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Adresse définitive du site. NOINDEX=1 : publié mais fermé à Google tant que le site est en relecture.
      SITE_URL: ${{ vars.SITE_URL || 'https://artisanarena.fr' }}
      NOINDEX: ${{ vars.NOINDEX || '1' }}
      CF_BEACON: ${{ vars.CF_BEACON || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Dépendances
        run: npm ci
      - name: Construire le site (avec test de la recherche)
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
