# Construit et publie le site sur GitHub Pages.
# - à chaque envoi sur la branche main ;
# - chaque lundi à 5 h 37 UTC, pour reprendre les nouvelles qualifications, les nouveaux jugements et les nouveaux comptes ;
# - à la demande, depuis l'onglet Actions.
name: Construire et publier

on:
  push:
    branches: [main]
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Adresse définitive du site. NOINDEX=1 : publié mais fermé à Google tant que le site est en relecture.
      SITE_URL: ${{ vars.SITE_URL || 'https://artisanarena.fr' }}
      NOINDEX: ${{ vars.NOINDEX || '1' }}
      CF_BEACON: ${{ vars.CF_BEACON || '' }}
      NODE_OPTIONS: --max-old-space-size=8192
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Dépendances
        run: |
          npm ci
          pip install pyarrow
      - name: Fichiers officiels en cache
        uses: actions/cache@v4
        with:
          path: data/raw
          key: raw-${{ github.run_id }}
          restore-keys: raw-
      - name: Télécharger les données (ADEME, Sirene, BODACC, INPI)
        run: npm run data:fetch
      - name: Préparer les données
        run: npm run data:prepare
      - name: Construire le site (avec contrôle des données)
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
